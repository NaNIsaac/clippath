[project]
name = "clippath"
version = "0.4.0"
description = "Screenshot once. Paste where you need it. Clipboard image -> PNG -> Windows/WSL path."
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[project.scripts]
clippath = "clippath:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["clippath"]
package-data = { clippath = ["*.ico"] }

[tool.ruff]
line-length = 100

# violations present when ruff became mandatory in CI; remove entries as they are fixed
[tool.ruff.lint.extend-per-file-ignores]
"assets/make_icon.py" = ["F401", "I001"]
"clippath/__init__.py" = ["SIM115", "SIM117"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
