[package]
name = "clippath"
version = "0.5.0"
edition = "2024"
description = "Screenshot once. Paste where you need it. Clipboard image -> PNG -> Windows/WSL path."
license = "MIT"
repository = "https://github.com/NaNIsaac/clippath"

[profile.release]
strip = true

[dependencies]
png = "0.18.1"
sha2 = "0.11.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Ole"] }
